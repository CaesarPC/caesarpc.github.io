<h1>CSSinJS</h1>
<h2>概述</h2>
<div class="meta">CaesarTools · 技術教程</div>
<p># 什麼是CSS-in-JS：樣式寫在JS裡</p>
<p>傳統CSS是獨立文件。CSS-in-JS把樣式寫在JS組件裡——Styled Components是最流行的方案。</p>
<p>## 一、怎麼寫</p>
<p>const Button = styled.button`
  background: blue;
  color: white;
  padding: 8px 16px;
`;</p>
<p>直接在React組件裡用<Button>。樣式和組件在同一個文件裡，組件刪了樣式自動刪。</p>
<p>## 二、好處</p>
<p>組件級樣式：樣式只在組件內生效，不用擔心全局CSS污染。
動態樣式：可以根據props動態計算樣式。
自動Tree Shaking：沒用到的組件樣式自動刪掉。</p>
<p>## 三、壞處</p>
<p>運行時開銷：Styled Components在瀏覽器裡動態生成CSS，有性能成本。
SSR支持複雜：服務端渲染要處理樣式提取。
和Tailwind等原子化方案相比，靈活性不如直接寫class。</p>
<p>## 四、總結</p>
<p>CSS-in-JS把樣式和組件綁定在一起，適合React生態。但運行時性能和SSR複雜度是代價。新項目可以根據團隊偏好選。</p>
