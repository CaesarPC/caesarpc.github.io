<h1>WebComponents</h1>
<h2>概述</h2>
<div class="meta">CaesarTools · 技術教程</div>
<p># 什麼是Web Components：框架無關的組件</p>
<p>React、Vue、Angular各有各的組件體系，不能互通。Web Components是瀏覽器原生的組件標準——用原生JS定義的組件，可以在任何框架裡用，甚至不用框架。</p>
<p>## 一、三個技術</p>
<p>Custom Elements：定義自己的HTML標籤，比如<my-button>。瀏覽器原生支持。
Shadow DOM：組件內部DOM和外部隔離，樣式不會泄漏。
HTML Templates：<template>標籤定義組件的HTML結構。</p>
<p>## 二、好處</p>
<p>框架無關：寫一次，React/Vue/原生HTML都能用。
封裝好：Shadow DOM隔離樣式和DOM。
原生標準：不用打包工具，瀏覽器直接支持。</p>
<p>## 三、壞處</p>
<p>生態不如框架組件豐富。
學習曲線。
複雜交互開發不如React/Vux方便。</p>
<p>## 四、總結</p>
<p>Web Components是瀏覽器原生組件標準。適合做跨框架的通用組件庫。應用開發還是用框架效率高。</p>
