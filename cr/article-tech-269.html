<p># 什么是CSS-in-JS：样式写在JS里</p>
<p>传统CSS是独立文件。CSS-in-JS把样式写在JS组件里——Styled Components是最流行的方案。</p>
<p>## 一、怎么写</p>
<p>const Button = styled.button`
  background: blue;
  color: white;
  padding: 8px 16px;
`;</p>
<p>直接在React组件里用<Button>。样式和组件在同一个文件里，组件删了样式自动删。</p>
<p>## 二、好处</p>
<p>组件级样式：样式只在组件内生效，不用担心全局CSS污染。
动态样式：可以根据props动态计算样式。
自动Tree Shaking：没用到的组件样式自动删掉。</p>
<p>## 三、坏处</p>
<p>运行时开销：Styled Components在浏览器里动态生成CSS，有性能成本。
SSR支持复杂：服务端渲染要处理样式提取。
和Tailwind等原子化方案相比，灵活性不如直接写class。</p>
<p>## 四、总结</p>
<p>CSS-in-JS把样式和组件绑定在一起，适合React生态。但运行时性能和SSR复杂度是代价。新项目可以根据团队偏好选。</p>
