<h1>WebComponents</h1>
<div class="meta">CaesarTools · 技术教程 📅 2026-10-15 </div>
<p># 什么是Web Components：框架无关的组件</p>
<p>React、Vue、Angular各有各的组件体系，不能互通。Web Components是浏览器原生的组件标准——用原生JS定义的组件，可以在任何框架里用，甚至不用框架。</p>
<p>## 一、三个技术</p>
<p>Custom Elements：定义自己的HTML标签，比如<my-button>。浏览器原生支持。
Shadow DOM：组件内部DOM和外部隔离，样式不会泄漏。
HTML Templates：<template>标签定义组件的HTML结构。</p>
<p>## 二、好处</p>
<p>框架无关：写一次，React/Vue/原生HTML都能用。
封装好：Shadow DOM隔离样式和DOM。
原生标准：不用打包工具，浏览器直接支持。</p>
<p>## 三、坏处</p>
<p>生态不如框架组件丰富。
学习曲线。
复杂交互开发不如React/Vux方便。</p>
<p>## 四、总结</p>
<p>Web Components是浏览器原生组件标准。适合做跨框架的通用组件库。应用开发还是用框架效率高。</p>
