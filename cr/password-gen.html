<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="description" content="免费在线密码生成器，可自定义长度、大小写、数字和特殊字符。">
<link rel="canonical" href="https://caesarpc.github.io/cr/password-gen.html"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>密码生成器 - CaesarTools</title>
<link rel="icon" href="../icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#1e1e2e;color:#e6e6e6;min-height:100vh;padding:20px}
.wrap{max-width:600px;margin:40px auto}
h1{font-size:24px;margin-bottom:20px;color:#50fa7b}
.box{background:#181825;border:1px solid #313244;border-radius:12px;padding:24px;margin-bottom:16px}
.result{font-size:20px;font-family:monospace;background:#11111b;padding:16px;border-radius:8px;word-break:all;border:1px solid #50fa7b;letter-spacing:2px;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
label{font-size:14px;color:#bac2de}
input[type=range]{width:200px}
input[type=checkbox]{width:18px;height:18px}
.val{font-size:18px;color:#50fa7b;font-weight:700;min-width:30px;text-align:right}
button{background:#50fa7b;color:#1e1e2e;border:none;padding:12px 24px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
button:hover{background:#69ff94}
.copy{background:#89b4fa;color:#1e1e2e;margin-top:8px}
.strength{font-size:14px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 密码生成器</h1>
  <div class="box">
    <div class="result" id="result">点击下方按钮生成</div>
    <div class="row"><label>长度</label><input type="range" id="len" min="8" max="64" value="16"><span class="val" id="lenv">16</span></div>
    <div class="row"><label>大写字母 A-Z</label><input type="checkbox" id="upper" checked></div>
    <div class="row"><label>小写字母 a-z</label><input type="checkbox" id="lower" checked></div>
    <div class="row"><label>数字 0-9</label><input type="checkbox" id="nums" checked></div>
    <div class="row"><label>特殊符号 !@#$%</label><input type="checkbox" id="syms" checked></div>
    <button onclick="gen()">🔄 生成密码</button>
    <button class="copy" onclick="copy()">📋 复制密码</button>
    <div class="strength" id="strength"></div>
  </div>
  <a href="/cr/" style="color:#89b4fa;font-size:14px">← 返回工具站</a>
</div>
<script>
document.getElementById('len').oninput=function(){document.getElementById('lenv').textContent=this.value};
function gen(){
  var len=+document.getElementById('len').value;
  var u=document.getElementById('upper').checked,l=document.getElementById('lower').checked;
  var n=document.getElementById('nums').checked,s=document.getElementById('syms').checked;
  var chars='',out='';
  if(u)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(l)chars+='abcdefghijklmnopqrstuvwxyz';
  if(n)chars+='0123456789';
  if(s)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars){alert('至少选一种');return}
  for(var i=0;i<len;i++)out+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('result').textContent=out;
  var st=document.getElementById('strength');
  var score=0;
  if(len>=12)score++;
  if(u&&l)score++;
  if(n)score++;
  if(s)score++;
  if(score<=1)st.textContent='强度：弱';st.style.color='#f38ba8';
  else if(score<=3)st.textContent='强度：中';st.style.color='#f9e2af';
  else{st.textContent='强度：强';st.style.color='#a6e3a1'}
}
function copy(){
  var t=document.getElementById('result').textContent;
  if(t==='点击下方按钮生成')return;
  navigator.clipboard.writeText(t).then(()=>alert('已复制！'));
}
</script>
</body>
</html>
