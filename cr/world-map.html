<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界地图 - Cr工具站</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e6e6f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
.wrap{max-width:100%;margin:0 auto;padding:12px}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px}
.header h1{font-size:20px;color:#50fa7b}
.header a{color:#6272a4;text-decoration:none;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{background:#1a1a2e;border:1px solid #2a2a4a;color:#e6e6f0;padding:7px 18px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.btns button.active{background:#50fa7b;color:#0f0f1a;border-color:#50fa7b;font-weight:bold}
#map-container{width:100%;height:calc(100vh - 80px);border-radius:12px;border:1px solid #2a4a6a;background:#0a1628;position:relative;overflow:hidden}
#map-container svg{width:100%;height:100%;cursor:grab}
#map-container svg:active{cursor:grabbing}
.country{stroke:rgba(0,0,0,.6);stroke-width:.5;cursor:pointer;transition:fill-opacity .15s}
.country:hover{fill-opacity:1;stroke:#fff;stroke-width:1}
.country-label{fill:rgba(255,255,255,.8);font-family:Georgia,serif;font-style:italic;font-weight:bold;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:2px;stroke-linejoin:round}
.tip{margin-top:6px;font-size:11px;color:#6272a4;text-align:center}
.legend{display:flex;gap:16px;justify-content:center;margin-top:4px;font-size:11px;color:#6272a4;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.tooltip{position:absolute;background:rgba(15,15,26,.95);border:1px solid #50fa7b;color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🌍 世界地图</h1>
    <div class="btns">
      <button class="active" onclick="setMode('modern',this)">现代</button>
      <button onclick="setMode('ww1',this)">一战 1914</button>
      <button onclick="setMode('ww2',this)">二战 1942</button>
    </div>
    <a href="index.html">← 返回工具站</a>
  </div>
  <div id="map-container"></div>
  <div class="legend" id="legend"></div>
  <div class="tip">拖拽平移 · 滚轮缩放 · 左右无缝循环 · 点击国家看详情</div>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
var nameCN={
'Afghanistan':'阿富汗','Albania':'阿尔巴尼亚','Algeria':'阿尔及利亚','Angola':'安哥拉',
'Argentina':'阿根廷','Armenia':'亚美尼亚','Australia':'澳大利亚','Austria':'奥地利','Azerbaijan':'阿塞拜疆',
'Bahamas':'巴哈马','Bangladesh':'孟加拉国','Belarus':'白俄罗斯','Belgium':'比利时','Belize':'伯利兹',
'Benin':'贝宁','Bhutan':'不丹','Bolivia':'玻利维亚','Bosnia and Herz.':'波黑','Botswana':'博茨瓦纳',
'Brazil':'巴西','Brunei':'文莱','Bulgaria':'保加利亚','Burkina Faso':'布基纳法索','Burundi':'布隆迪',
'Cambodia':'柬埔寨','Cameroon':'喀麦隆','Canada':'加拿大','Central African Rep.':'中非','Chad':'乍得',
'Chile':'智利','China':'中国','Colombia':'哥伦比亚','Congo':'刚果(布)','Costa Rica':'哥斯达黎加',
'Croatia':'克罗地亚','Cuba':'古巴','Cyprus':'塞浦路斯','Czech Rep.':'捷克',"Côte d'Ivoire":'科特迪瓦',
'Dem. Rep. Congo':'刚果(金)','Denmark':'丹麦','Djibouti':'吉布提','Dominican Rep.':'多米尼加',
'Ecuador':'厄瓜多尔','Egypt':'埃及','El Salvador':'萨尔瓦多','Eq. Guinea':'赤道几内亚','Eritrea':'厄立特里亚',
'Estonia':'爱沙尼亚','Ethiopia':'埃塞俄比亚','Falkland Is.':'福克兰群岛','Fiji':'斐济','Finland':'芬兰',
'France':'法国','Gabon':'加蓬','Gambia':'冈比亚','Georgia':'格鲁吉亚',
'Germany':'德国','Ghana':'加纳','Greece':'希腊','Greenland':'格陵兰','Guatemala':'危地马拉','Guinea':'几内亚',
'Guinea-Bissau':'几内亚比绍','Guyana':'圭亚那','Haiti':'海地','Honduras':'洪都拉斯','Hungary':'匈牙利',
'Iceland':'冰岛','India':'印度','Indonesia':'印度尼西亚','Iran':'伊朗','Iraq':'伊拉克','Ireland':'爱尔兰',
'Israel':'以色列','Italy':'意大利','Jamaica':'牙买加','Japan':'日本','Jordan':'约旦','Kazakhstan':'哈萨克斯坦',
'Kenya':'肯尼亚','Kosovo':'科索沃','Kuwait':'科威特','Kyrgyzstan':'吉尔吉斯斯坦','Laos':'老挝',
'Latvia':'拉脱维亚','Lebanon':'黎巴嫩','Lesotho':'莱索托','Liberia':'利比里亚','Libya':'利比亚',
'Lithuania':'立陶宛','Luxembourg':'卢森堡','Madagascar':'马达加斯加','Malawi':'马拉维','Malaysia':'马来西亚',
'Mali':'马里','Mauritania':'毛里塔尼亚','Mexico':'墨西哥','Moldova':'摩尔多瓦','Mongolia':'蒙古',
'Montenegro':'黑山','Morocco':'摩洛哥','Mozambique':'莫桑比克','Myanmar':'缅甸','N. Cyprus':'北塞浦路斯',
'Namibia':'纳米比亚','Nepal':'尼泊尔','Netherlands':'荷兰','New Caledonia':'新喀里多尼亚','New Zealand':'新西兰',
'Nicaragua':'尼加拉瓜','Niger':'尼日尔','Nigeria':'尼日利亚','North Korea':'朝鲜','North Macedonia':'北马其顿',
'Norway':'挪威','Oman':'阿曼','Pakistan':'巴基斯坦','Palestine':'巴勒斯坦','Panama':'巴拿马',
'Papua New Guinea':'巴布亚新几内亚','Paraguay':'巴拉圭','Peru':'秘鲁','Philippines':'菲律宾','Poland':'波兰',
'Portugal':'葡萄牙','Puerto Rico':'波多黎各','Qatar':'卡塔尔','Romania':'罗马尼亚','Russia':'俄罗斯',
'Rwanda':'卢旺达','S. Sudan':'南苏丹','Saudi Arabia':'沙特阿拉伯','Senegal':'塞内加尔','Serbia':'塞尔维亚',
'Sierra Leone':'塞拉利昂','Slovakia':'斯洛伐克','Slovenia':'斯洛文尼亚','Solomon Is.':'所罗门群岛',
'Somalia':'索马里','Somaliland':'索马里兰','South Africa':'南非','South Korea':'韩国','Spain':'西班牙',
'Sri Lanka':'斯里兰卡','Sudan':'苏丹','Suriname':'苏里南','Sweden':'瑞典','Switzerland':'瑞士',
'Syria':'叙利亚','Taiwan':'台湾','Tajikistan':'塔吉克斯坦','Tanzania':'坦桑尼亚','Thailand':'泰国',
'Timor-Leste':'东帝汶','Togo':'多哥','Trinidad and Tobago':'特立尼达和多巴哥','Tunisia':'突尼斯',
'Turkey':'土耳其','Turkmenistan':'土库曼斯坦','Uganda':'乌干达','Ukraine':'乌克兰',
'United Arab Emirates':'阿联酋','United Kingdom':'英国','United States':'美国','Uruguay':'乌拉圭',
'Uzbekistan':'乌兹别克斯坦','Vanuatu':'瓦努阿图','Venezuela':'委内瑞拉','Vietnam':'越南',
'Yemen':'也门','Zambia':'赞比亚','Zimbabwe':'津巴布韦','eSwatini':'斯威士兰'
};
function cnName(en){return nameCN[en]||en;}

var bigCountries={'China':1,'United States':1,'Russia':1,'Canada':1,'Brazil':1,'Australia':1,'India':1,
'Argentina':1,'Kazakhstan':1,'Algeria':1,'Dem. Rep. Congo':1,'Greenland':1,'Saudi Arabia':1,
'Mexico':1,'Indonesia':1,'Libya':1,'Iran':1,'Mongolia':1,'Peru':1,'Chad':1,'Niger':1,'Angola':1,
'Sudan':1,'Colombia':1,'South Africa':1,'Ethiopia':1,'Egypt':1,'Tanzania':1,'Nigeria':1,
'Turkey':1,'France':1,'Spain':1,'Germany':1,'Sweden':1,'Finland':1,'Norway':1,'Poland':1,
'Ukraine':1,'Japan':1,'United Kingdom':1,'Italy':1,'Vietnam':1,'Thailand':1,'Myanmar':1,
'Madagascar':1,'Mozambique':1,'Zambia':1,'Namibia':1,'Botswana':1,'Afghanistan':1,'Iraq':1,
'Yemen':1,'Oman':1,'Pakistan':1,'Bangladesh':1,'Uzbekistan':1,'Bolivia':1,'Mauritania':1,
'United Arab Emirates':1};

var ww1Set={},ww2Axis={},ww2Soviet={},ww2Allies={};
['Austria','Hungary','Czech Rep.','Slovakia','Croatia','Bosnia and Herz.','Slovenia','Serbia','Romania','Bulgaria','Turkey','Syria','Iraq','Lebanon','Israel','Jordan','Saudi Arabia','Russia','Ukraine','Belarus','Finland','Poland','Estonia','Latvia','Lithuania','Moldova','Georgia','Armenia','Azerbaijan','Germany','France'].forEach(function(n){ww1Set[n]='#c9a84c'});
['Germany','Italy','Japan','Hungary','Romania','Bulgaria','Finland','Croatia'].forEach(function(n){ww2Axis[n]='#d94444'});
['Russia','Ukraine','Belarus','Estonia','Latvia','Lithuania','Moldova','Georgia','Armenia','Azerbaijan','Kazakhstan','Uzbekistan','Turkmenistan','Kyrgyzstan','Tajikistan'].forEach(function(n){ww2Soviet[n]='#aa2222'});
['United Kingdom','France','United States','Canada','Australia','New Zealand','China','Netherlands','Belgium','Norway','Greece'].forEach(function(n){ww2Allies[n]='#4477dd'});

function getColor(name,mode){
  if(mode==='ww1'&&ww1Set[name])return ww1Set[name];
  if(mode==='ww2'){
    if(ww2Axis[name])return ww2Axis[name];
    if(ww2Soviet[name])return ww2Soviet[name];
    if(ww2Allies[name])return ww2Allies[name];
  }
  var hash=0;
  for(var i=0;i<name.length;i++)hash=(hash*31+name.charCodeAt(i))>>>0;
  var hue=hash%360;
  return 'hsl('+hue+',45%,40%)';
}

var currentMode='modern';
var width,height,svg,g,projection,path,zoom;
var geoData=null;

function initMap(){
  var container=document.getElementById('map-container');
  width=container.clientWidth;
  height=container.clientHeight;
  
  svg=d3.select('#map-container').append('svg')
    .attr('width',width).attr('height',height);
  
  projection=d3.geoRobinson()
    .scale(width/6.5)
    .translate([width/2,height/2]);
  
  path=d3.geoPath().projection(projection);
  
  zoom=d3.zoom()
    .scaleExtent([1,8])
    .on('zoom',function(event){
      g.attr('transform',event.transform);
      updateLabels(event.transform.k);
    });
  
  svg.call(zoom);
  g=svg.append('g');
  drawCountries();
}

function drawCountries(){
  if(!geoData)return;
  g.selectAll('*').remove();
  
  [-360,0,360].forEach(function(offset){
    var gOffset=g.append('g').attr('class','map-copy');
    gOffset.selectAll('path')
      .data(geoData.features)
      .enter().append('path')
      .attr('class','country')
      .attr('d',function(d){
        var clone=JSON.parse(JSON.stringify(d));
        function shiftCoords(coords){
          if(typeof coords[0]==='number'){coords[0]+=offset;return}
          coords.forEach(shiftCoords);
        }
        shiftCoords(clone.geometry.coordinates);
        return path(clone);
      })
      .attr('fill',function(d){return getColor(d.properties.name,currentMode)})
      .attr('fill-opacity',.88)
      .on('mouseover',function(event,d){
        var tt=document.getElementById('tooltip');
        tt.textContent=cnName(d.properties.name);
        tt.style.opacity=1;
        tt.style.left=(event.offsetX+10)+'px';
        tt.style.top=(event.offsetY-30)+'px';
      })
      .on('mousemove',function(event){
        var tt=document.getElementById('tooltip');
        tt.style.left=(event.offsetX+10)+'px';
        tt.style.top=(event.offsetY-30)+'px';
      })
      .on('mouseout',function(){document.getElementById('tooltip').style.opacity=0});
  });
  
  var labelG=g.append('g').attr('class','labels');
  geoData.features.forEach(function(f){
    var n=f.properties.name;
    if(!bigCountries[n])return;
    var centroid=path.centroid(f);
    if(isNaN(centroid[0])||isNaN(centroid[1]))return;
    labelG.append('text')
      .attr('class','country-label')
      .attr('x',centroid[0])
      .attr('y',centroid[1])
      .attr('data-size',bigCountries[n]?'big':'small')
      .style('font-size',function(){return bigCountries[n]?'16px':'10px'})
      .text(cnName(n));
  });
}

function updateLabels(scale){
  g.selectAll('.country-label')
    .style('font-size',function(){
      var base=d3.select(this).attr('data-size')==='big'?16:10;
      return Math.max(8,base/scale)+'px';
    })
    .style('opacity',function(){return scale<1.5?.7:1});
}

fetch('data/world.json')
  .then(function(r){return r.json()})
  .then(function(geo){
    geoData=geo;
    initMap();
  });

function setMode(mode,btn){
  currentMode=mode;
  document.querySelectorAll('.btns button').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  if(g){
    g.selectAll('.country').attr('fill',function(d){return getColor(d.properties.name,currentMode)});
  }
  var lg=document.getElementById('legend');
  if(mode==='ww1'){
    lg.innerHTML='<span><i style="background:#c9a84c"></i>一战帝国疆域</span><span><i style="background:#3a3a5a"></i>其他国家</span>';
  }else if(mode==='ww2'){
    lg.innerHTML='<span><i style="background:#d94444"></i>轴心国</span><span><i style="background:#aa2222"></i>苏联势力</span><span><i style="background:#4477dd"></i>同盟国</span>';
  }else{lg.innerHTML='';}
}

window.addEventListener('resize',function(){
  if(svg){
    var container=document.getElementById('map-container');
    width=container.clientWidth;height=container.clientHeight;
    svg.attr('width',width).attr('height',height);
    projection.scale(width/6.5).translate([width/2,height/2]);
    drawCountries();
  }
});
</script>
</body>
</html>
