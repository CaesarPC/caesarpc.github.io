<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>远程控制</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:-apple-system,sans-serif}
.box{text-align:center}
.spin{width:40px;height:40px;border:3px solid #333;border-top-color:#0a84ff;border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.err{color:#ff453a}
.go{display:block;margin:22px auto 0;padding:14px 34px;border:none;border-radius:12px;font-size:17px;font-weight:600;color:#fff;background:#0a84ff;font-family:inherit}
</style>
</head>
<body>
<div class="box">
  <div id="spin" class="spin"></div>
  <div id="msg">正在连接…</div>
</div>
<script>
(function(){
  var msg=document.getElementById('msg');
  var spin=document.getElementById('spin');
  function fail(t){
    spin.style.display='none';
    msg.innerHTML='<span class="err">'+t+'</span><button class="go" onclick="location.reload()">重试</button>';
  }

  function probe(url){
    return new Promise(function(resolve){
      var t0=performance.now();
      fetch(url+'/?ts='+Date.now(),{cache:'no-store'})
        .then(function(r){
          resolve({url:url,ms:performance.now()-t0,ok:r.status<500,status:r.status});
        })
        .catch(function(){resolve({url:url,ms:Infinity,ok:false});});
    });
  }

  fetch('remote/url.json?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(d){
      var list=[];
      if(d&&Array.isArray(d.urls)&&d.urls.length){
        d.urls.forEach(function(x){if(x&&x.url&&list.indexOf(x.url)<0)list.push(x.url);});
      }
      if(d&&d.url&&list.indexOf(d.url)<0){list.push(d.url);}
      if(!list.length){fail('电脑未在线');return;}
      msg.textContent='正在选择最快线路…';
      Promise.all(list.map(probe)).then(function(res){
        var ok=res.filter(function(x){return x.ok;});
        ok.sort(function(a,b){return a.ms-b.ms;});
        if(ok.length){
          location.replace(ok[0].url);
        }else{
          fail('线路暂不可用');
        }
      });
    })
    .catch(function(){fail('连接失败');});
})();
</script>
</body>
</html>
