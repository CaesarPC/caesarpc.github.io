<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>远程控制入口</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:"LXGW WenKai Lite","LXGW WenKai","Kaiti SC",-apple-system,sans-serif}
.box{text-align:center;padding:24px;max-width:520px;width:100%}
.spin{width:40px;height:40px;border:3px solid #333;border-top-color:#0a84ff;border-radius:50%;margin:0 auto 20px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.err{color:#ff453a}
.go{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:18px 20px;border:none;border-radius:14px;font-size:19px;font-weight:600;color:#fff;background:#0a84ff;cursor:pointer;text-align:center;font-family:inherit}
.go small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:6px}
.go.alt{background:#3a3a3c}
.tip{color:#8e8e93;font-size:13px;line-height:1.6;margin-top:14px}
.card{display:none}
.card.show{display:block}
</style>
<link rel="stylesheet" href="/fonts/lxgw-wenkai-lite/lxgw-wenkai-lite.css">
</head>
<body>
<div class="box">
  <div id="spin" class="spin"></div>
  <div id="msg">正在获取远程地址…</div>
  <div id="card" class="card">
    <button id="btnDirect" class="go">直连（IPv6 · 最快）<small id="dTip"></small></button>
    <button id="btnTunnel" class="go alt">隧道（兼容 · 较慢）<small>iPad 没有 IPv6 时用这个</small></button>
    <div class="tip">直连走你家宽带，画质和帧率都高很多。<br>点直连若打不开（提示找不到服务器），回上一页点隧道即可。</div>
  </div>
</div>
<script>
(function(){
  var msg=document.getElementById('msg');
  var spin=document.getElementById('spin');
  var card=document.getElementById('card');
  var btnD=document.getElementById('btnDirect');
  var btnT=document.getElementById('btnTunnel');
  var dTip=document.getElementById('dTip');
  var turl=null, dlist=[];

  function fail(t){
    spin.style.display='none'; card.classList.remove('show');
    msg.innerHTML='<span class="err">'+t+'</span><br><br>'+
      '<button class="go alt" onclick="location.reload()" style="max-width:220px;margin:0 auto">重试</button>';
  }

  function ready(){
    if(!turl && !dlist.length){ fail('电脑未在线'); return; }
    if(!dlist.length){
      // 没有 IPv6：老行为，直接跳隧道
      msg.textContent='正在连接电脑（隧道）…';
      window.location.replace(turl);
      return;
    }
    spin.style.display='none';
    msg.textContent='';
    if(!turl){ btnT.style.display='none'; }
    card.classList.add('show');
  }

  btnD.onclick=function(){
    try{localStorage.setItem('rc_pref','direct')}catch(e){}
    msg.textContent='正在直连…';
    window.location.replace(dlist[0]);
  };
  btnT.onclick=function(){
    try{localStorage.setItem('rc_pref','tunnel')}catch(e){}
    msg.textContent='正在连接隧道…';
    window.location.replace(turl);
  };

  // 上次选过直连就默认高亮；两条都可用时把直连放前面
  try{
    if(localStorage.getItem('rc_pref')==='tunnel'){ card.insertBefore(btnT,btnD); }
  }catch(e){}

  var done=0;
  function finish(){ if(++done<2) return; ready(); }

  fetch('remote/url.json?ts='+Date.now()).then(function(r){return r.json()})
    .then(function(d){ turl=d.url||null; }).catch(function(){}).then(finish);

  fetch('remote/direct.json?ts='+Date.now()).then(function(r){return r.json()})
    .then(function(d){
      dlist=(d.direct||[]).slice(0,3);
      dTip.textContent = dlist.length ? ('本机 IPv6 已就绪') : '';
    }).catch(function(){}).then(finish);

  setTimeout(function(){ if(!card.classList.contains('show') && !turl && !dlist.length) fail('获取地址超时'); },8000);
})();
</script>
</body>
</html>
